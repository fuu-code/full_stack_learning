<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Font Family</title>
  <style>
    #helvetica {
      font-family: Helvetica, sans-serif;
      font-weight: normal;
    }

    #arial {
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    #serif {
      font-family: serif;
      font-weight: bolder;
    }

    #sans-serif {
      font-family: sans-serif;
      font-weight: lighter;
    }

    #cursive {
      font-family: cursive;
      font-weight: 100;
    }

    #monospace {
      font-family: monospace;
      font-weight: 900;
    }

    #fantasy {
      font-family: fantasy;
    }

    #timesnewroman{
      font-family: "Times New Roman", serif;
      font-weight: bold;
    }
    h1 {
      font-family: "Bungee Spice", sans-serif;
      font-weight: 400;
      font-style: normal;
      text-align: center;
    }

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
  <h1>Font Family</h1>
  <p id="helvetica">Helvetica</p>
  <p id="arial">Arial</p>
  <p id="serif">Serif</p>
  <p id="sans-serif">Sans Serif</p>
  <p id="cursive">Cursive</p>
  <p id="monospace">Monospace</p>
  <p id="fantasy">Fantasy</p>
  <p id="timesnewroman">Times New Roman</p>

</body>

</html>
