<!doctype html>
<html lang="en">
  <head>

    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <ol>
      <li>
        Switzerland Flag
        <div class="switzerland">
          <div class="vertical"></div>
          <div class="horizon"></div>
        </div>
      </li>
      <br />
      <li>
        Norway Flag
        <div class="norway">
          <div class="horizon"><div></div></div>
          <div class="vertical"><div></div></div>
        </div>

      <br />
      <li>
        Greece Flag
        <div class="greece">
          <div class="stripe-1"></div>
          <div class="stripe-2"></div>
          <div class="stripe-3"></div>
          <div class="stripe-4"></div>
          <div class="box-greece">
            <div class="vertical"></div>
            <div class="horizon"></div>
          </div>
        </div>
      </li>
      <br />
      <li>
        Japan Flag
        <div class="japan">
          <div class="circle-red"></div>
        </div>
      </li>
    </ol>
